        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { font-size: 24px; color: var(--orange); }
        .header p { font-size: 13px; color: var(--text-dim); }
        .btn-primary { background: var(--orange); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-primary:hover { background: var(--orange-dim); }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--bdim); display: flex; align-items: center; gap: 15px; }
        .stat-icon { width: 40px; height: 40px; border-radius: 10px; background: rgba(240, 124, 42, 0.1); color: var(--orange); display: grid; place-items: center; font-size: 20px; }
        .stat-info span { display: block; font-size: 11px; color: var(--text-dim); }
        .stat-info strong { font-size: 20px; font-weight: 900; }
        .table-container { background: var(--card); border-radius: 12px; border: 1px solid var(--bdim); overflow: hidden; }
        .data-table { width: 100%; border-collapse: collapse; text-align: right; }
        .data-table th { padding: 12px 20px; font-size: 12px; color: var(--text-dim); background: rgba(255, 255, 255, 0.02); border-bottom: 1px solid var(--bdim); }
        .data-table td { padding: 15px 20px; font-size: 13px; border-bottom: 1px solid var(--bdim); }
        .badge { background: rgba(240, 124, 42, 0.1); color: var(--orange); padding: 2px 8px; border-radius: 4px; font-size: 11px; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); display: none; place-items: center; z-index: 1000; padding: 20px; }
        .modal-overlay.active { display: grid; }
        .modal-content { background: #0b192c; border: 1px solid rgba(240, 124, 42, 0.3); border-radius: 16px; width: 100%; max-width: 600px; overflow: hidden; }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--bdim); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 20px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .form-group label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 6px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 10px 12px; border-radius: 8px; color: white; font-family: 'Cairo'; outline: none; }
        .full-width { grid-column: 1 / -1; }
        .modal-footer { padding: 20px; border-top: 1px solid var(--bdim); display: flex; justify-content: flex-end; gap: 10px; }
        .btn-secondary { background: rgba(255, 255, 255, 0.05); color: var(--text-dim); border: 1px solid var(--bdim); padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="watermark"></div>
    <header class="header">
        <div>
            <h1>إدارة المحطات (EAM_CMMS_Pro)</h1>
            <p>عرض وتعديل بيانات المحطات، الطاقة التصميمية والفعلية، وكفاءة التشغيل.</p>
        </div>
        <button class="btn-primary" onclick="openModal()">+ إضافة محطة جديدة</button>
    </header>
    <section class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon">⛫</div>
            <div class="stat-info">
                <span>إجمالي المحطات</span>
                <strong id="total-stations">0</strong>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon" style="color: var(--green); background: rgba(46,204,113,0.1);">✓</div>
            <div class="stat-info">
                <span>متوسط الكفاءة</span>
                <strong id="avg-eff">0%</strong>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon" style="color: #F1C40F; background: rgba(241,196,15,0.1);">⚡</div>
            <div class="stat-info">
                <span>إجمالي الطاقة الفعلية</span>
                <strong id="total-prod">0 م³</strong>
            </div>
        </div>
    </section>
    <div class="table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>اسم المحطة</th>
                    <th>القطاع</th>
                    <th>النوع</th>
                    <th>المأخذ</th>
                    <th>المصب</th>
                    <th>الطاقة التصميمية (م³/يوم)</th>
                    <th>الطاقة الفعلية (م³/يوم)</th>
                    <th>الكفاءة</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
    <div class="modal-overlay" id="stationModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="color: var(--orange);">إضافة محطة جديدة</h3>
                <button onclick="closeModal()" style="background: none; color: white; border: none; font-size: 20px; cursor: pointer;">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-grid">
                    <div class="form-group">
                        <label>اسم المحطة *</label>
                        <input type="text" id="s-name" placeholder="مثال: محطة العمده صالح">
                    </div>
                    <div class="form-group">
                        <label>القطاع *</label>
                        <select id="s-sector">
                            <option>الإسماعيلية</option>
                            <option>السويس</option>
                            <option>بورسعيد</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>النوع</label>
                        <select id="s-type">
                            <option>مياه</option>
                            <option>صرف</option>
                            <option>معالجة</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>المنطقة</label>
                        <input type="text" id="s-area" placeholder="المنطقة التابع لها">
                    </div>
                    <div class="form-group">
                        <label>المأخذ</label>
                        <input type="text" id="s-intake" placeholder="مصدر التغذية">
                    </div>
                    <div class="form-group">
                        <label>المصب</label>
                        <input type="text" id="s-outlet" placeholder="جهة الصرف النهائي">
                    </div>
                    <div class="form-group">
                        <label>الطاقة التصميمية (م³/يوم)</label>
                        <input type="number" id="s-design">
                    </div>
                    <div class="form-group">
                        <label>الطاقة الفعلية (م³/يوم)</label>
                        <input type="number" id="s-actual">
                    </div>
                    <div class="form-group full-width">
                        <label>ملاحظات التشغيل</label>
                        <textarea id="s-notes" rows="3" placeholder="أي ملاحظات إضافية..."></textarea>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">إلغاء</button>
                <button class="btn-primary" onclick="saveStation()">حفظ البيانات</button>
            </div>
        </div>
    </div>
    <script>
        let stations = [{"name": "أبو عارف الجديدة", "sector": "السويس", "type": "مياه", "design": 120000, "actual": 95000, "eff": 88, "area": "منطقة السويس", "intake": "ترعة السويس", "outlet": "شبكة التوزيع", "id": "1"}, {"name": "جنيفة", "sector": "السويس", "type": "مياه", "design": 45000, "actual": 32000, "eff": 75, "area": "منطقة السويس", "intake": "ترعة السويس", "outlet": "شبكة التوزيع", "id": "2"}, {"name": "كبريت", "sector": "السويس", "type": "مياه", "design": 10000, "actual": 8500, "eff": 85, "area": "منطقة السويس", "intake": "ترعة السويس", "outlet": "شبكة التوزيع", "id": "3"}, {"name": "العمده صالح", "sector": "الإسماعيلية", "type": "معالجة", "design": 5000, "actual": 2661, "eff": 80, "area": "منطقة الإسماعيلية", "intake": "ترعة الإسماعيلية", "outlet": "شبكة التوزيع", "id": "4"}, {"name": "الضبعيه", "sector": "الإسماعيلية", "type": "معالجة", "design": 5000, "actual": 2397, "eff": 70, "area": "منطقة الإسماعيلية", "intake": "ترعة الإسماعيلية", "outlet": "شبكة التوزيع", "id": "5"}, {"name": "عين غصين الكبري", "sector": "الإسماعيلية", "type": "معالجة", "design": 8000, "actual": 7965, "eff": 95, "area": "منطقة الإسماعيلية", "intake": "ترعة الإسماعيلية", "outlet": "شبكة التوزيع", "id": "6"}];
        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            let totalActual = 0;
            let totalEff = 0;
            stations.forEach(s => {
                totalActual += Number(s.actual) || 0;
                totalEff += Number(s.eff) || 0;
                let color = s.eff >= 90 ? '#2ECC71' : (s.eff >= 75 ? '#F1C40F' : '#E74C3C');
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${s.name}</strong></td>
                        <td>${s.sector}</td>
                        <td><span class="badge">${s.type}</span></td>
                        <td>${s.intake || '-'}</td>
                        <td>${s.outlet || '-'}</td>
                        <td>${Number(s.design).toLocaleString()}</td>
                        <td>${Number(s.actual).toLocaleString()}</td>
                        <td><strong style="color: ${color}">${s.eff}%</strong></td>
                    </tr>
                `;
            });
            document.getElementById('total-stations').innerText = stations.length;
            document.getElementById('total-prod').innerText = totalActual.toLocaleString() + ' م³';
            document.getElementById('avg-eff').innerText = stations.length ? Math.round(totalEff / stations.length) + '%' : '0%';
        }
        function openModal() { document.getElementById('stationModal').classList.add('active'); }
        function closeModal() { document.getElementById('stationModal').classList.remove('active'); }
        function saveStation() {
            const nameInput = document.getElementById('s-name');
            const name = nameInput.value;
            if(!name) { alert('الرجاء إدخال اسم المحطة'); return; }
            const design = Number(document.getElementById('s-design').value) || 0;
            const actual = Number(document.getElementById('s-actual').value) || 0;
            const eff = design > 0 ? Math.round((actual / design) * 100) : 0;
            stations.push({
                id: Date.now().toString(),
                name: name,
                sector: document.getElementById('s-sector').value,
                type: document.getElementById('s-type').value,
                area: document.getElementById('s-area').value,
                intake: document.getElementById('s-intake').value,
                outlet: document.getElementById('s-outlet').value,
                design: design,
                actual: actual,
                eff: eff
            });
            renderTable();
            closeModal();
            nameInput.value = '';
            document.getElementById('s-design').value = '';
            document.getElementById('s-actual').value = '';
            document.getElementById('s-intake').value = '';
            document.getElementById('s-outlet').value = '';
        }
        renderTable();
    </script>
</body>
</html>
